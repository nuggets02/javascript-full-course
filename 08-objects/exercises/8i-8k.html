<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8i-8k</title>
  </head>
  <body>
    <button onclick="
      playGame('heads');   
    ">
      heads
    </button>

    <button onclick="
      playGame('tails');
    ">
      tails
    </button>
    
    <script>
      const score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0
      };

      function playGame(guess) {
        const randomNumber = Math.random();
        let result = randomNumber < 0.5 ? 'heads' : 'tails';

        const status = guess === result ? 'You win!' : 'You lose!';

        if (status === 'You win!')
          score.wins++;
        else 
          score.losses++;

        localStorage.setItem('score', JSON.stringify(score));

        console.log(`Wins: ${score.wins}, Losses: ${score.losses}`);
      }  
    </script>
  </body>
</html>
