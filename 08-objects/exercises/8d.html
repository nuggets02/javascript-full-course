<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <title>8d</title>
  </head>
  <body>
    
    <script>
      const product1 = {
        name: 'sneakers',
        price: 1999
      }

      const product2 = {
        name: 'hoodie',
        price: 2900
      }

      function comparePrice(product1, product2) {

        if (product1.price < product2.price) 
          return product1;

        else
          return product2; 
      }   

      console.log(comparePrice(product1, product2));
    </script>
  </body>
