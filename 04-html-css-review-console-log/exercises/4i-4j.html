<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <style>
    .add-to-cart-button {
      background-color: yellow;
      cursor: pointer;
    }

    .buy-button {
      background-color: orange;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p>Adults Plain Cotton T-shirt</p>
  <p>Price: $7.99</p>

  <button class="add-to-cart-button" onclick="
    alert('Added');
  ">
    Add to cart
  </button>

  <button class="buy-button" onclick="
    console.log('Loading...');
    alert('Purchased');
  ">
    Buy now
  </button>

  <script>
    console.log('Welcome!');
  </script>
</body>
</html>
