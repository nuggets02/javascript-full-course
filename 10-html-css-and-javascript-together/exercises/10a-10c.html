<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10a-10c</title>
    <style>
      div {
        margin-top: 50px;
        margin-bottom: 25px;
      }

      .add-to-cart-button {
        background-color: rgb(255, 216, 20);
        border: none;
        font-size: 18px;
        padding: 8px 55px;
        border-radius: 50px;
        cursor: pointer;
      }

      .request-now-button {
        background-color: black;
        color: white;
        border: none;
        font-size: 15px;
        font-weight: bold;
        padding: 14px 24px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 20px;
      }

      .schedule-later-button {
        background-color: rgb(230, 230, 230);
        font-size: 15px;
        font-weight: bold;
        border: none;
        padding: 14px 24px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button class="add-to-cart-button">
      Add to Cart
    </button>

    <div>
      <button class="request-now-button">
        Request now
      </button>

      <button class="schedule-later-button">
        Schedule for later
      </button>
    </div>

    <button class="js-button">
      Test
    </button>

    <script>
      console.log(document.querySelector('.js-button')
        .classList.contains('js-button'));
    </script>
  </body>
</html>
