<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <p>Cart Quantity</p>

    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">
      Show Quantity
    </button>

    <button onclick="
      updateCartQuantity(1);
    ">
      Add to Cart
    </button>

    <button onclick="
      updateCartQuantity(2);
    ">
      +2
    </button>

    <button onclick="
      updateCartQuantity(3);
    ">
      +3
    </button>

    <button onclick="
      updateCartQuantity(4);
    ">
      +4
    </button>

    <button onclick="
      updateCartQuantity(5);
    ">
      +5
    </button>

    <button onclick="
      updateCartQuantity(-1);
    ">
      Remove from cart
    </button>

    <button onclick="
      updateCartQuantity(-2);
    ">
      -2
    </button>

    <button onclick="
      updateCartQuantity(-3);
    ">
      -3
    </button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      localStorage.removeItem('cartQuantity');
      displayCartQuantity(cartQuantity);
    ">
      Reset Cart
    </button>

    <p class="js-cart-quantity"></p>

    <script>
      let cartQuantity = Number(localStorage.getItem('cartQuantity')) || 0;

      displayCartQuantity(cartQuantity);

      function updateCartQuantity(value) {
        if (cartQuantity + value > 10) {
          alert('The cart is full!');
          return;
        }

        if (cartQuantity + value < 0) {
          alert('Not enough items in the cart!');
          return;
        } 
        
        cartQuantity += value;

        localStorage.setItem('cartQuantity', cartQuantity);

        displayCartQuantity(cartQuantity);
      }

      function displayCartQuantity(quantity) {
        document.querySelector('.js-cart-quantity')
          .innerHTML = `Cart quantity: ${quantity}`;
      }
    </script>
  </body>
</html>
