<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9g-9h</title>
  </head>
  <body>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>

    <input type="text" placeholder="Cost of order" class="js-cost-input" onkeydown="
      handleCostKeydown(event);
    ">

    <button onclick="
      calculateTotal();
    ">
      Calculate
    </button>

    <p class="js-total-cost"></p> 

    <div style="margin-top: 30px;">
      <input type="text" placeholder="Type something" onkeyup="
        displayText();
      " class="js-text-input">

      <p class="js-text"></p>
    </div>
    
    <script>
      function displayText() {
        const text = document.querySelector('.js-text-input').value;

        document.querySelector('.js-text')
          .innerHTML = text;
      }

      function handleCostKeydown(event) {
        if (event.key === 'Enter')
          calculateTotal();
      }

      function calculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value) * 100;

        if (cost < 4000) 
          cost += 1000;

        document.querySelector('.js-total-cost')
          .innerHTML = `$${cost / 100}`;
      }
    </script>
  </body>
</html>
