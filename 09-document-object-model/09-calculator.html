<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
  </head>
  <body>
    <p>Calculator</p>

    <p class="js-display"></p>

    <p>
      <button onclick="
        updateCalculation('1');
      ">
        1
      </button>

      <button onclick="
        updateCalculation('2');
      ">
        2
      </button>

      <button onclick="
        updateCalculation('3');
      ">
        3
      </button>

      <button onclick="
        updateCalculation(' + ');
      ">
        +
      </button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">
        4
      </button>

      <button onclick="
        updateCalculation('5');
      ">
        5
      </button>

      <button onclick="
        updateCalculation('6');
      ">
        6
      </button>

      <button onclick="
        updateCalculation(' - ');
      ">
        -
      </button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">
        7
      </button>

      <button onclick="
        updateCalculation('8');
      ">
        8
      </button>

      <button onclick="
        updateCalculation('9');
      ">
        9
      </button>

      <button onclick="
        updateCalculation(' * ');
      ">
        *
      </button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">
        0
      </button>

      <button onclick="
        updateCalculation('.');
      ">
        .
      </button>

      <button onclick="
        calculation = eval(calculation);
        calculationDone = true;
        saveToLocalStorage(calculation);
        displayCalculation(calculation);
      ">
        =
      </button>

      <button onclick="
        updateCalculation(' / ');
      ">
        /
      </button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        calculationDone = false;
        localStorage.removeItem('calculation');
        displayCalculation(calculation);
      ">
        Clear
      </button>
    </p>

    <script>
      let calculation = localStorage.getItem('calculation') || '';
      let calculationDone = false;

      displayCalculation(calculation);

      function updateCalculation(value) {
        if (calculationDone) {

          if (!isNaN(value) || value === '.') {
            calculation = value;
            calculationDone = false;
            saveToLocalStorage(calculation);
            displayCalculation(calculation);
            return;
          }
          
          calculationDone = false;
        }

        calculation += value;

        saveToLocalStorage(calculation);
        displayCalculation(calculation);
      }

      function saveToLocalStorage(calculation) {
        localStorage.setItem('calculation', calculation)
      }

      function displayCalculation(calculation) {
        document.querySelector('.js-display')
          .textContent = String(calculation);
      }
    </script>
  </body>
</html>
